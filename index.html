<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>すぐせか | すぐに学べる世界史クイズ</title>
    <meta name="description" content="すぐせかは、ブラウザですぐに始められる世界史クイズアプリ。インストール不要・登録不要で、ランダムに出題される世界史の重要語を4択で学び、解説で理解を深められます。">
    <meta property="og:type" content="website">
    <meta property="og:title" content="すぐせか | すぐに学べる世界史クイズ">
    <meta property="og:description" content="ブラウザですぐに始められる世界史クイズ「すぐせか」。インストール不要・登録不要で、4択問題と解説で世界史を学べます。">
    <meta property="og:locale" content="ja_JP">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="すぐせか | すぐに学べる世界史クイズ">
    <meta name="twitter:description" content="ブラウザですぐに始められる世界史クイズ「すぐせか」。インストール不要・登録不要で今すぐ世界史学習。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* Layout: one narrow column. Header, a question card, four stacked choices, then result + explanation. */
        :root {
            color-scheme: light;
            --bg: #F3EFE8;
            --surface: #FFFDF9;
            --ink: #2A2320;
            --muted: #6E625A;
            --line: #DDD3C6;
            --accent: #9A4A24;
            --accent-ink: #FFFFFF;
            --accent-soft: #F3E1D6;
            --good: #1E8A4C;
            --good-bg: #DDF3E6;
            --bad: #B83A32;
            --bad-bg: #FBE3E0;
            --jp: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #171311;
                --surface: #221C19;
                --ink: #EFE8E2;
                --muted: #A99C92;
                --line: #3A302B;
                --accent: #E4976D;
                --accent-ink: #2A140A;
                --accent-soft: #43281B;
                --good: #5CCB8A;
                --good-bg: #143A28;
                --bad: #F08A82;
                --bad-bg: #40201E;
                color-scheme: dark;
            }
        }

        :root[data-theme="dark"] {
            --bg: #171311;
            --surface: #221C19;
            --ink: #EFE8E2;
            --muted: #A99C92;
            --line: #3A302B;
            --accent: #E4976D;
            --accent-ink: #2A140A;
            --accent-soft: #43281B;
            --good: #5CCB8A;
            --good-bg: #143A28;
            --bad: #F08A82;
            --bad-bg: #40201E;
            color-scheme: dark;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 14px var(--jp);
            padding-inline: 16px;
            padding-block: 20px 32px;
        }

        [hidden] {
            display: none !important;
        }

        .app {
            max-width: 520px;
            margin-inline: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        button {
            font-family: inherit;
        }

        :focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
        }

        .top {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
        }

        .brand {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 28px 20px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            text-align: center;
        }

        .intro-title {
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.5;
            text-wrap: balance;
        }

        .intro-text {
            margin: 0;
            font-size: 1rem;
            line-height: 1.8;
            color: var(--muted);
            max-width: 30ch;
        }

        .primary {
            font-size: 1.1rem;
            font-weight: 700;
            min-height: 52px;
            padding-inline: 32px;
            border: 0;
            border-radius: 12px;
            background: var(--accent);
            color: var(--accent-ink);
            cursor: pointer;
        }

        /* ---------- question ---------- */
        .qcard {
            align-items: stretch;
            text-align: left;
            gap: 16px;
        }

        .era {
            align-self: flex-start;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
        }

        .question {
            margin: 0;
            font-size: clamp(1.05rem, 4.4vw, 1.18rem);
            font-weight: 500;
            line-height: 1.9;
            letter-spacing: 0.02em;
            overflow-wrap: anywhere;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .choice {
            font-size: 1.1rem;
            font-weight: 700;
            min-height: 56px;
            padding: 12px 16px;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: var(--surface);
            color: var(--ink);
            border: 1.5px solid var(--line);
            border-radius: 12px;
            cursor: pointer;
            overflow-wrap: anywhere;
            transition: border-color 0.12s, background-color 0.12s, opacity 0.12s;
        }

        .choice:hover:not(:disabled) {
            border-color: var(--accent);
        }

        .choice:disabled {
            cursor: default;
            color: var(--ink);
        }

        .choice.is-correct {
            background: var(--good-bg);
            border-color: var(--good);
        }

        .choice.is-correct::after {
            content: "\2713";
            color: var(--good);
        }

        .choice.is-wrong {
            background: var(--bad-bg);
            border-color: var(--bad);
        }

        .choice.is-wrong::after {
            content: "\00D7";
            color: var(--bad);
            font-size: 1.3rem;
        }

        .choice.is-dim {
            opacity: 0.5;
        }

        /* ---------- result + explanation ---------- */
        .feedback {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .badge {
            flex: none;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 999px;
        }

        .badge.good {
            background: var(--good-bg);
            color: var(--good);
        }

        .badge.bad {
            background: var(--bad-bg);
            color: var(--bad);
        }

        .status-text {
            font-size: 1rem;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .explain {
            background: var(--surface);
            border: 1px solid var(--line);
            border-left: 4px solid var(--accent);
            border-radius: 12px;
            padding: 14px 16px;
        }

        .explain-head {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 6px;
        }

        .explain p {
            margin: 0;
            font-size: 1rem;
            line-height: 1.9;
            overflow-wrap: anywhere;
        }

        /* ---------- keep ---------- */
        .keeprow {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .ghost {
            font-size: 0.95rem;
            font-weight: 700;
            min-height: 44px;
            padding: 8px 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            color: var(--ink);
            border: 1.5px solid var(--line);
            border-radius: 10px;
            cursor: pointer;
        }

        .ghost:hover {
            border-color: var(--accent);
        }

        .ghost svg {
            width: 18px;
            height: 18px;
            flex: none;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linejoin: round;
        }

        .ghost[aria-pressed="true"] {
            background: var(--accent-soft);
            border-color: var(--accent);
            color: var(--accent);
        }

        .ghost[aria-pressed="true"] svg {
            fill: currentColor;
        }

        .count {
            min-width: 1.6em;
            padding: 1px 7px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 0.85rem;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .list-panel {
            align-items: stretch;
            text-align: left;
            padding: 16px;
            gap: 8px;
        }

        .list-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .list-head h2 {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .klist {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        .kitem {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 0;
            border-top: 1px solid var(--line);
        }

        .kword {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .kword b {
            font-size: 1.1rem;
            overflow-wrap: anywhere;
        }

        .kword span {
            color: var(--muted);
            font-size: 0.9rem;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .mini {
            flex: none;
            min-width: 44px;
            min-height: 44px;
            padding: 0 12px;
            background: transparent;
            border: 1.5px solid var(--line);
            border-radius: 10px;
            color: var(--bad);
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
        }

        .empty {
            margin: 0;
            padding: 16px 0 8px;
            font-size: 0.95rem;
            line-height: 1.7;
            color: var(--muted);
        }

        @media (prefers-reduced-motion: reduce) {
            .choice {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <main class="app">
        <div class="top">
            <div class="brand">すぐせか</div>
        </div>

        <section class="panel" id="intro">
            <div class="intro-title">すぐに学べる<br>世界史</div>
            <p class="intro-text" id="introText">世界史の重要語からランダムに出題します。問題文を読んで、答えを4つから選んでください。</p>
            <button class="primary" id="startBtn" type="button">はじめる</button>
        </section>

        <div id="quiz" class="app" hidden>
            <section class="panel qcard">
                <span class="era" id="era"></span>
                <p class="question" id="question"></p>
            </section>

            <div class="choices" id="choices"></div>

            <div class="feedback" id="feedback" aria-live="polite" hidden>
                <div class="status" id="status"></div>
                <div class="explain">
                    <div class="explain-head">解説</div>
                    <p id="explain"></p>
                </div>
                <button class="primary" id="nextBtn" type="button">次へ</button>
            </div>

            <div class="keeprow">
                <button class="ghost" id="keepBtn" type="button" aria-pressed="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z" />
                    </svg>
                    <span id="keepLabel">キープ</span>
                </button>
                <button class="ghost" id="listBtn" type="button">キープ一覧 <span class="count" id="keepCount">0</span></button>
            </div>
        </div>

        <section class="panel list-panel" id="keepView" hidden>
            <div class="list-head">
                <h2 id="keepTitle">キープ一覧</h2>
                <button class="ghost" id="backBtn" type="button">もどる</button>
            </div>
            <ul class="klist" id="klist"></ul>
            <p class="empty" id="kempty">まだありません。問題の画面で「キープ」を押すと、ここに集まります。</p>
        </section>
    </main>

    <script src="words.js"></script>
    <script>
        (function () {
            var $ = function (id) { return document.getElementById(id); };
            var deck = [], pos = 0, current = null, answered = false;

            /* ---------- keep (saved in this browser, by word id) ---------- */
            var KEY = "suguseka.keptWords.v1";
            var BY_ID = {};
            WORDS.forEach(function (w) { BY_ID[w.id] = w; });
            var kept = [];
            try {
                var raw = window.localStorage.getItem(KEY);
                var arr = raw ? JSON.parse(raw) : [];
                if (Array.isArray(arr)) {
                    kept = arr.filter(function (id) { return typeof id === "number" && Object.prototype.hasOwnProperty.call(BY_ID, id); });
                }
            } catch (e) { kept = []; }

            function saveKept() {
                try { window.localStorage.setItem(KEY, JSON.stringify(kept)); } catch (e) { }
            }
            function isKept(id) { return kept.indexOf(id) !== -1; }

            function renderList() {
                var ul = $("klist");
                ul.innerHTML = "";
                $("kempty").hidden = kept.length > 0;
                kept.forEach(function (id) {
                    var w = BY_ID[id];
                    var li = document.createElement("li");
                    li.className = "kitem";

                    var word = document.createElement("div");
                    word.className = "kword";
                    var b = document.createElement("b");
                    b.textContent = w.word;
                    var s = document.createElement("span");
                    s.textContent = w.explanation;
                    word.appendChild(b);
                    word.appendChild(s);

                    var d = document.createElement("button");
                    d.type = "button";
                    d.className = "mini";
                    d.setAttribute("aria-label", w.word + " をキープから削除");
                    d.textContent = "削除";
                    d.addEventListener("click", function () { removeKept(id); });

                    li.appendChild(word);
                    li.appendChild(d);
                    ul.appendChild(li);
                });
            }

            function renderKeep() {
                var on = !!current && isKept(current.id);
                $("keepBtn").setAttribute("aria-pressed", on ? "true" : "false");
                $("keepLabel").textContent = on ? "キープ済み" : "キープ";
                $("keepCount").textContent = String(kept.length);
                $("keepTitle").textContent = "キープ一覧(" + kept.length + "語)";
                if (!$("keepView").hidden) renderList();
            }

            function toggleKeep() {
                if (!current) return;
                var i = kept.indexOf(current.id);
                if (i === -1) kept.unshift(current.id);
                else kept.splice(i, 1);
                saveKept();
                renderKeep();
            }

            function removeKept(id) {
                var i = kept.indexOf(id);
                if (i === -1) return;
                kept.splice(i, 1);
                saveKept();
                renderKeep();
                var next = $("klist").querySelector(".mini");
                (next || $("backBtn")).focus();
            }

            function showKeepView() {
                $("quiz").hidden = true;
                $("keepView").hidden = false;
                renderKeep();
                $("backBtn").focus();
            }
            function hideKeepView() {
                $("keepView").hidden = true;
                $("quiz").hidden = false;
                $("listBtn").focus();
            }

            /* ---------- sound ---------- */
            var ctx = null;
            function audio() {
                try {
                    if (!ctx) {
                        var AC = window.AudioContext || window.webkitAudioContext;
                        if (AC) ctx = new AC();
                    }
                    if (ctx && ctx.state === "suspended") ctx.resume();
                } catch (e) { ctx = null; }
                return ctx;
            }
            function tone(c, freq, start, dur, type, vol) {
                var o = c.createOscillator(), g = c.createGain();
                o.type = type; o.frequency.value = freq;
                var t0 = c.currentTime + start;
                g.gain.setValueAtTime(0.0001, t0);
                g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
                g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
                o.connect(g); g.connect(c.destination);
                o.start(t0); o.stop(t0 + dur + 0.05);
            }
            function playCorrect() {
                var c = audio(); if (!c) return;
                tone(c, 1318.5, 0, 0.18, "sine", 0.3);
                tone(c, 1046.5, 0.16, 0.45, "sine", 0.3);
            }
            function playWrong() {
                var c = audio(); if (!c) return;
                tone(c, 150, 0, 0.2, "square", 0.12);
                tone(c, 150, 0.26, 0.32, "square", 0.12);
            }

            /* ---------- quiz ---------- */
            function shuffle(a) {
                for (var i = a.length - 1; i > 0; i--) {
                    var j = Math.floor(Math.random() * (i + 1));
                    var t = a[i]; a[i] = a[j]; a[j] = t;
                }
                return a;
            }

            function drawWord() {
                if (pos >= deck.length) {
                    deck = shuffle(WORDS.map(function (_, i) { return i; }));
                    pos = 0;
                }
                return WORDS[deck[pos++]];
            }

            function nextQuestion() {
                answered = false;
                current = drawWord();
                var options = shuffle([current.answer].concat(current.wrong));

                $("era").textContent = current.era;
                $("question").textContent = current.question;
                $("feedback").hidden = true;
                renderKeep();

                var box = $("choices");
                box.innerHTML = "";
                options.forEach(function (label) {
                    var b = document.createElement("button");
                    b.type = "button";
                    b.className = "choice";
                    b.textContent = label;
                    b.addEventListener("click", function () { choose(b); });
                    box.appendChild(b);
                });
                window.scrollTo(0, 0);
            }

            function choose(btn) {
                if (answered) return;
                answered = true;
                var ok = btn.textContent === current.answer;
                (ok ? playCorrect : playWrong)();

                var list = $("choices").children;
                for (var i = 0; i < list.length; i++) {
                    var el = list[i];
                    el.disabled = true;
                    if (el.textContent === current.answer) el.classList.add("is-correct");
                    else if (el === btn) el.classList.add("is-wrong");
                    else el.classList.add("is-dim");
                }

                var st = $("status");
                st.innerHTML = "";
                var badge = document.createElement("span");
                badge.className = "badge " + (ok ? "good" : "bad");
                badge.textContent = ok ? "正解" : "不正解";
                var text = document.createElement("span");
                text.className = "status-text";
                text.textContent = "答えは「" + current.answer + "」";
                st.appendChild(badge);
                st.appendChild(text);
                $("explain").textContent = current.explanation;
                $("feedback").hidden = false;

                $("nextBtn").focus();
            }

            function start() {
                audio();
                $("intro").hidden = true;
                $("quiz").hidden = false;
                nextQuestion();
            }

            $("startBtn").addEventListener("click", start);
            $("nextBtn").addEventListener("click", function () { audio(); nextQuestion(); });
            $("keepBtn").addEventListener("click", toggleKeep);
            $("listBtn").addEventListener("click", showKeepView);
            $("backBtn").addEventListener("click", hideKeepView);

            document.addEventListener("keydown", function (e) {
                if (!$("keepView").hidden) {
                    if (e.key === "Escape") hideKeepView();
                    return;
                }
                if ($("quiz").hidden) return;
                if (!answered && e.key >= "1" && e.key <= "4") {
                    var b = $("choices").children[Number(e.key) - 1];
                    if (b) choose(b);
                } else if (answered && (e.key === "Enter" || e.key === " ") && e.target === document.body) {
                    e.preventDefault();
                    nextQuestion();
                }
            });

            $("introText").textContent = "世界史の重要語" + WORDS.length + "語からランダムに出題します。問題文を読んで、答えを4つから選んでください。";
            renderKeep();
        })();
    </script>
</body>

</html>
